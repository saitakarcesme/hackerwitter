<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hackerwitter</title>
<meta name="description" content="The YouTube videos that Hacker News keeps telling each other to watch, as a timeline.">
<meta property="og:site_name" content="Hackerwitter">
<meta property="og:type" content="website">
<meta property="og:title" content="Hackerwitter">
<meta property="og:description" content="The YouTube videos that Hacker News keeps telling each other to watch, as a timeline.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Hackerwitter">
<meta name="twitter:description" content="The YouTube videos that Hacker News keeps telling each other to watch, as a timeline.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/data/videos.json" as="fetch" crossorigin>
<link rel="stylesheet" href="/app.css">
<script>
  // apply the saved theme before first paint
  try {
    const t = JSON.parse(localStorage.getItem("theme"));
    const a = JSON.parse(localStorage.getItem("accent"));
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    if (a) document.documentElement.dataset.accent = a;
  } catch {}
</script>
</head>
<body>
<div class="app">
  <header class="nav" id="nav"></header>
  <main class="col" id="col">
    <div class="mtop" id="mtop"></div>
    <div id="view"><div class="status"><span class="spinner"></span></div></div>
  </main>
  <aside class="side" id="side"></aside>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
